<script>
(()=>{
  const root=document.getElementById('black-voice-preview');
  if(!root)return;
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  for(const face of root.querySelectorAll('article.rbv')){
    const one=s=>face.querySelector(s), act=k=>one('[data-act="'+k+'"]');
    const idle=one('[data-view=idle]'), active=one('[data-view=active]');
    const status=one('[data-role=state]'), timer=one('[data-role=timer]'), call=act('call'), history=act('history'), mute=act('mute'), hang=act('hang');
    const muteLabel=mute.lastElementChild, records=[];
    let dialTimer, clock, began=0, muted=false, opener;
    const sheet=document.createElement('div');
    sheet.className='bv-sheet';sheet.hidden=true;
    sheet.innerHTML='<div class="bv-sheet-top"><strong>報數據</strong><button class="bv-back cursor-interaction" type="button">返回專線</button></div><h3></h3><p></p><div class="bv-sheet-list"></div><button class="bv-return cursor-interaction" type="button">查看通話紀錄</button>';
    face.append(sheet);
    const back=sheet.querySelector('.bv-back'), more=sheet.querySelector('.bv-return');
    function sheetMode(mode){
      const historyPage=mode==='history';
      if(sheet.hidden)opener=face.contains(document.activeElement)?document.activeElement:call;
      for(const el of face.children){if(el!==sheet)el.inert=true;}
      sheet.hidden=false;
      sheet.querySelector('h3').textContent=historyPage?'通話紀錄':'通話已結束';
      sheet.querySelector('p').textContent=historyPage?(records.length?'本次預覽的通話紀錄':'撥打第一通後，紀錄會出現在這裡。'):'你和 AI 小黑的示範通話';
      const list=sheet.querySelector('.bv-sheet-list'); list.replaceChildren();
      for(const item of (historyPage?records:records.slice(0,1))){
        const row=document.createElement('div');row.className='bv-record';
        for(const text of [historyPage?'AI 小黑 · 示範通話':'本次通話時間',fmt(item)]){
          const cell=document.createElement('span');cell.textContent=text;row.append(cell);
        }
        list.append(row);
      }
      more.hidden=historyPage;back.focus({preventScroll:true});
    }
    function closeSheet(){
      sheet.hidden=true;
      for(const el of face.children){if(el!==sheet)el.inert=false;}
      (opener && opener.getClientRects().length?opener:call).focus({preventScroll:true});
    }
    back.onclick=closeSheet;
    sheet.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
    more.onclick=()=>sheetMode('history');history.onclick=()=>sheetMode('history');
    function setMute(value){
      muted=value;
      mute.setAttribute('aria-pressed',String(value));muteLabel.textContent=value?'取消靜音':'靜音';
      if(face.dataset.state==='connected')status.textContent=value?'麥克風已靜音':'通話中';
    }
    function dial(){
      if(face.dataset.state!=='idle'||!sheet.hidden)return;
      face.dataset.state='dialing';idle.hidden=true;active.hidden=false;
      status.textContent='撥號中…';timer.textContent='';history.disabled=true;
      mute.disabled=true;setMute(false);hang.focus({preventScroll:true});
      dialTimer=setTimeout(()=>{
        face.dataset.state='connected';status.textContent='通話中';began=Date.now();
        timer.textContent='00:00';mute.disabled=false;
        clock=setInterval(()=>{timer.textContent=fmt(Math.floor((Date.now()-began)/1000));},300);
      },1200);
    }
    call.addEventListener('click',dial);
    hang.onclick=()=>{
      const connected=face.dataset.state==='connected';
      clearTimeout(dialTimer);clearInterval(clock);
      if(connected)records.unshift(Math.floor((Date.now()-began)/1000));
      face.dataset.state='idle';active.hidden=true;idle.hidden=false;history.disabled=false;
      if(connected)sheetMode('ended');else call.focus({preventScroll:true});
    };
    mute.onclick=()=>{if(face.dataset.state==='connected')setMute(!muted);};
    if(face.classList.contains('rbv-retro')){
      let drag=null,ignoreClick=false;
      const reset=()=>{drag=null;call.removeAttribute('data-dragging');call.style.setProperty('--wheel-turn','0deg');};
      call.addEventListener('pointerdown',e=>{
        if(!e.isPrimary||e.button!==0)return;
        const r=call.getBoundingClientRect(), x=r.x+r.width/2, y=r.y+r.height/2;
        if(Math.hypot(e.clientX-x,e.clientY-y)<r.width*.22)return;
        drag={id:e.pointerId,x,y,start:Math.atan2(e.clientY-y,e.clientX-x),amount:0};
        ignoreClick=false;call.setPointerCapture(e.pointerId);call.setAttribute('data-dragging','');
      });
      call.addEventListener('pointermove',e=>{
        if(!drag||e.pointerId!==drag.id)return;
        const a=Math.atan2(e.clientY-drag.y,e.clientX-drag.x)-drag.start;
        drag.amount=Math.atan2(Math.sin(a),Math.cos(a))*180/Math.PI;
        call.style.setProperty('--wheel-turn',Math.max(-6,Math.min(125,drag.amount))+'deg');
      });
      call.addEventListener('pointerup',e=>{
        if(!drag||e.pointerId!==drag.id)return;
        const amount=drag.amount;reset();
        if(Math.abs(amount)>8){ignoreClick=true;if(amount>=28)dial();setTimeout(()=>{ignoreClick=false;},0);}
      });
      call.addEventListener('pointercancel',reset);
      call.addEventListener('click',e=>{if(ignoreClick){e.stopImmediatePropagation();e.preventDefault();}},true);
    }
  }
})();
</script>
